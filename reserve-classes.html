<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تقارير حصص الاحتياط | الابتدائية السابعة بمحافظة الوجه</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#10b981;--secondary:#059669;--dark:#047857;--light:#d1fae5;--accent:#fbbf24;--text:#0f172a;--gray:#475569;--shadow:0 4px 12px rgba(16,185,129,.1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:'Tajawal',system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 50%,#f0fdf4 100%);color:var(--text);line-height:1.65;min-height:100vh;overflow-x:hidden;font-size:16px;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
.page{width:94vw;max-width:1200px;margin:0 auto;padding:26px 12px 70px}
.card-page{background:linear-gradient(135deg,#fff 0%,#ecfdf5 100%);padding:22px;border-radius:18px;box-shadow:0 10px 30px rgba(15,118,110,.12)}
.report-header{background:linear-gradient(135deg,#14532d,#166534);color:#fff;padding:14px 16px;border-radius:10px;margin-bottom:18px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.08);border:1px solid rgba(255,255,255,.2)}
.report-header h2{font-size:1.4rem;margin-bottom:8px;font-weight:900;text-shadow:1px 1px 2px rgba(0,0,0,.18)}
.report-header .school-name{font-size:1.08rem;font-weight:900;margin-bottom:5px}
.report-header .program-title{font-size:1.25rem;font-weight:900;margin-top:7px;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:8px;display:inline-block}
.wait-intro{text-align:center;color:var(--gray);font-size:.95rem;margin-bottom:18px}
.form{display:grid;gap:14px}.grid-3{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:768px){.grid-3{grid-template-columns:repeat(3,1fr)}}
label{display:flex;flex-direction:column;gap:6px;color:var(--text);font-weight:800;font-size:.88rem}
.input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:2px solid #bbf7d0;background:#fefdf9;font-family:'Tajawal',sans-serif;font-size:1rem;transition:all .2s;color:var(--text);line-height:1.75}
textarea{min-height:110px;resize:vertical;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;direction:rtl;unicode-bidi:plaintext;letter-spacing:0;word-spacing:0;text-align:right}
.input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(16,185,129,.18);background:#fff}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.chip{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#ecfdf5,#dcfce7);padding:7px 10px;border-radius:999px;border:1px solid #bbf7d0;font-size:.82rem;cursor:pointer;transition:all .2s;user-select:none}.chip input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}.chip:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,185,129,.25)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}@media(min-width:768px){.actions{flex-direction:row}}.btn{border:none;border-radius:14px;padding:10px 16px;font-weight:900;font-size:.95rem;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 4px 15px rgba(16,185,129,.35);transition:transform .15s,box-shadow .15s;width:100%;text-align:center;font-family:'Tajawal',sans-serif}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,185,129,.45)}.btn:active{transform:scale(.99)}.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 4px 15px rgba(185,28,28,.35)}
.date-with-hijri{position:relative}.date-input-container{position:relative;display:flex;align-items:center}.date-input-container .input{padding-right:44px;cursor:pointer}.hijri-toggle{position:absolute;left:7px;top:50%;transform:translateY(-50%);background:transparent;border:none;cursor:pointer;width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:all .2s}.hijri-toggle:hover{background:rgba(16,185,129,.12)}.hijri-icon{width:18px;height:18px;fill:var(--dark)}
.hijri-calendar{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(15,118,110,.2);padding:12px;z-index:1500;width:90vw;max-width:320px;border:2px solid #bbf7d0;display:none}.hijri-calendar.active{display:block;animation:fadeIn .2s ease}.hijri-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #e5e7eb}.hijri-month-year{font-weight:900;color:var(--dark);font-size:.95rem}.hijri-nav{display:flex;gap:4px}.hijri-nav button{background:#ecfdf5;border:none;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:.75rem;font-weight:900;color:var(--dark);transition:all .2s;font-family:'Tajawal',sans-serif}.hijri-nav button:hover{background:var(--primary);color:#fff}.hijri-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:900;color:var(--dark);font-size:.75rem;margin-bottom:4px}.hijri-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.hijri-day{padding:6px 2px;text-align:center;border-radius:6px;cursor:pointer;font-size:.8rem;color:var(--text);transition:all .2s;font-weight:800}.hijri-day:hover{background:#ecfdf5}.today-btn{margin-top:8px;width:100%;padding:7px 10px;border:none;border-radius:8px;cursor:pointer;font-weight:900;font-size:.85rem;background:#ecfdf5;color:var(--dark);transition:all .2s;font-family:'Tajawal',sans-serif}.today-btn:hover{background:var(--primary);color:#fff}
.wait-subtitle{margin-top:20px;margin-bottom:8px;font-size:1.05rem;color:var(--dark);font-weight:900;border-right:4px solid var(--accent);padding-right:8px}.table-wrap{margin-top:8px;border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(15,118,110,.12);overflow-x:auto;background:#fff}table{width:100%;border-collapse:collapse;min-width:750px;font-size:.8rem}th,td{padding:8px 6px;border-bottom:1px solid #e5e7eb;text-align:center;vertical-align:top}th{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-weight:900;font-size:.78rem;white-space:nowrap}tbody tr:nth-child(even){background:#f9fafb}tbody tr:hover{background:#ecfdf5}td.text-right{text-align:right;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;unicode-bidi:plaintext}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;padding:10px 14px;border-radius:999px;font-size:.9rem;font-weight:900;box-shadow:0 8px 20px rgba(15,118,110,.35);z-index:2000;animation:fadeIn .2s ease;max-width:92%;text-align:center}.toast.warn{background:linear-gradient(135deg,#facc15,#eab308);color:#111827}.toast.danger{background:linear-gradient(135deg,#ef4444,#b91c1c)}@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(max-width:768px){.card-page{padding:18px}.report-header{padding:15px}.report-header h2{font-size:1.3rem}.input,textarea,select{font-size:1rem}}@media(max-width:480px){.page{width:100%;padding:10px 8px 50px}.report-header h2{font-size:1.15rem}}
</style>
</head>
<body>
<main class="page">
<section class="card-page">
  <div class="report-header">
    <h2>تقرير تنفيذ</h2>
    <div class="school-name">الابتدائية السابعة بمحافظة الوجه</div>
    <div class="program-title">حصص الاحتياط</div>
  </div>

  <p class="wait-intro">سجلي تفاصيل حصص الاحتياط التي قمتِ بتنفيذها. يتم حفظ البيانات محلياً في المتصفح.</p>

  <form id="sesForm" class="form" autocomplete="off">
    <div class="grid-3">
      <label>الأسبوع *
        <select class="input" id="weekNumber" required>
          <option value="">اختاري الأسبوع</option>
          <option>الأول</option><option>الثاني</option><option>الثالث</option><option>الرابع</option><option>الخامس</option>
          <option>السادس</option><option>السابع</option><option>الثامن</option><option>التاسع</option><option>العاشر</option>
          <option>الحادي عشر</option><option>الثاني عشر</option><option>الثالث عشر</option><option>الرابع عشر</option><option>الخامس عشر</option>
        </select>
      </label>
      <label>اليوم *
        <select class="input" id="dayName" required>
          <option value="">اختاري اليوم</option>
          <option>الأحد</option><option>الإثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option>
        </select>
      </label>
      <label class="date-with-hijri">التاريخ (هجري) *
        <div class="date-input-container">
          <input class="input hijri-date-input" id="sessionDate" required placeholder="اختر التاريخ الهجري" readonly>
          <button type="button" class="hijri-toggle" aria-label="اختيار تاريخ">
            <svg class="hijri-icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V9h14v10zM5 7V5h14v2H5zm2 4h10v2H7v-2zm0 4h7v2H7v-2z"/></svg>
          </button>
        </div>
        <div class="hijri-calendar">
          <div class="hijri-header">
            <div class="hijri-month-year"></div>
            <div class="hijri-nav">
              <button type="button" class="prev-year">«</button><button type="button" class="prev-month">‹</button><button type="button" class="next-month">›</button><button type="button" class="next-year">»</button>
            </div>
          </div>
          <div class="hijri-weekdays"><span>ح</span><span>ن</span><span>ث</span><span>ر</span><span>خ</span><span>ج</span><span>س</span></div>
          <div class="hijri-days"></div>
          <button type="button" class="today-btn">اختر اليوم</button>
        </div>
      </label>
    </div>

    <div class="grid-3">
      <label>الصف / الفصل *<input class="input" id="className" required placeholder="مثال: 2 / أ"></label>
      <label>رقم الحصة *<input class="input" id="sessionNumber" required placeholder="مثال: 3" inputmode="numeric"></label>
      <label>المعلمة الغائبة *<input class="input" id="absentTeacher" required placeholder="مثال: أ/ سارة محمد"></label>
    </div>

    <label>ما تم تنفيذه مع الطالبات *
      <textarea class="input" id="activitiesText" required placeholder="اكتبي بإيجاز ما تم عمله في حصة الاحتياط..."></textarea>
    </label>

    <label>المجال / نوع النشاط *
      <div class="chipset">
        <label class="chip"><input type="checkbox" id="basicSkills"><span>المهارات الأساسية</span></label>
        <label class="chip"><input type="checkbox" id="values"><span>القيم والمواطنة الصالحة</span></label>
        <label class="chip"><input type="checkbox" id="futureSkills"><span>مهارات المستقبل</span></label>
      </div>
    </label>

    <div class="actions">
      <button class="btn" type="button" id="saveSession">حفظ الحصة</button>
      <button class="btn" type="button" id="exportSessions">تصدير / طباعة</button>
      <button class="btn danger" type="button" id="clearAll">مسح جميع الحصص</button>
    </div>
  </form>

  <h3 class="wait-subtitle">الحصص المسجلة</h3>
  <div class="table-wrap">
    <table>
      <thead><tr><th>م</th><th>الأسبوع</th><th>اليوم</th><th>التاريخ</th><th>الصف</th><th>الحصة</th><th>المعلمة الغائبة</th><th>ما تم تنفيذه</th><th>المجال</th><th>إجراء</th></tr></thead>
      <tbody id="sessionsBody"></tbody>
    </table>
  </div>
</section>
</main>

<script>
function showToast(msg,type){type=type||'';const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .25s'},1400);setTimeout(()=>t.remove(),1900)}
function escapeHtml(text){if(text===null||text===undefined)return'';return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function safeSetStorage(key,value){try{localStorage.setItem(key,value);return true}catch(e){showToast('التخزين المحلي ممتلئ أو ممنوع على هذا المتصفح.','danger');return false}}
function safeGetStorage(key){try{return localStorage.getItem(key)}catch(e){return null}}
function openPrintWindow(html){const w=window.open('','_blank');if(!w){showToast('المتصفح منع فتح نافذة. فعّلي النوافذ المنبثقة.','warn');return}w.document.open();w.document.write(html);w.document.close();w.document.title='';w.onload=async function(){try{if(w.document.fonts&&w.document.fonts.ready)await w.document.fonts.ready}catch(_){}setTimeout(()=>{try{w.focus();w.print()}catch(_){}},250)}}

let waitSessions=[];
function waitLoadSessions(){const saved=safeGetStorage('seventh_reserve_sessions');if(saved){try{waitSessions=JSON.parse(saved)||[]}catch(_){waitSessions=[]}}renderWaitSessions()}
function waitSaveSessions(){safeSetStorage('seventh_reserve_sessions',JSON.stringify(waitSessions))}
function renderWaitSessions(){const body=document.getElementById('sessionsBody');body.innerHTML='';waitSessions.forEach((s,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${i+1}</td><td>${escapeHtml(s.week)}</td><td>${escapeHtml(s.day)}</td><td>${escapeHtml(s.date)}</td><td>${escapeHtml(s.className)}</td><td>${escapeHtml(s.number)}</td><td>${escapeHtml(s.teacher)}</td><td class="text-right">${escapeHtml(s.activities)}</td><td class="text-right">${escapeHtml(s.fields)}</td><td><button class="btn danger" style="width:auto;padding:4px 10px;font-size:.75rem;border-radius:999px;box-shadow:none" type="button" data-del-wait="${i}">حذف</button></td>`;body.appendChild(tr)});body.querySelectorAll('[data-del-wait]').forEach(b=>{b.addEventListener('click',()=>{const i=Number(b.dataset.delWait);if(!confirm('هل تريدين حذف هذه الحصة؟'))return;waitSessions.splice(i,1);waitSaveSessions();renderWaitSessions();showToast('تم حذف الحصة')})})}

function buildWaitPrintHTML(list){const rows=list.map((s,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(s.week||'')}</td><td>${escapeHtml(s.day||'')}</td><td>${escapeHtml(s.date||'')}</td><td>${escapeHtml(s.className||'')}</td><td>${escapeHtml(s.number||'')}</td><td>${escapeHtml(s.teacher||'')}</td><td class="txt">${escapeHtml(s.activities||'')}</td><td class="txt">${escapeHtml(s.fields||'')}</td></tr>`).join('');return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"><title></title><style>*{box-sizing:border-box}body{margin:0;background:#fff;font-family:'Tajawal',system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif;color:#0f172a}@page{size:A4 landscape;margin:10mm}.hdr{text-align:center;margin-bottom:6mm}.school{font-size:13pt;font-weight:900;color:#14532d;margin-bottom:3px}h1{margin:0;font-size:16pt;font-weight:900;color:#047857}table{width:100%;border-collapse:collapse;font-size:11pt}th,td{border:1px solid #bbf7d0;padding:6px;text-align:center;vertical-align:top}th{background:#16a34a;color:#fff;font-weight:900}td.txt{text-align:right;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;unicode-bidi:plaintext}.sign{margin-top:8mm;border-top:1px solid #bbf7d0;padding-top:5mm;direction:ltr;text-align:left}.s1{font-weight:900;color:#047857}</style></head><body><div class="hdr"><div class="school">الابتدائية السابعة بمحافظة الوجه</div><h1>تقارير حصص الاحتياط</h1></div><table><thead><tr><th>م</th><th>الأسبوع</th><th>اليوم</th><th>التاريخ</th><th>الصف</th><th>الحصة</th><th>المعلمة الغائبة</th><th>ما تم تنفيذه</th><th>المجال</th></tr></thead><tbody>${rows}</tbody></table><div class="sign"><div class="s1">مديرة المدرسة</div></div></body></html>`}

function initWaitForm(){document.getElementById('saveSession').addEventListener('click',()=>{const week=document.getElementById('weekNumber').value;const day=document.getElementById('dayName').value;const date=document.getElementById('sessionDate').value;const className=document.getElementById('className').value.trim();const number=document.getElementById('sessionNumber').value.trim();const teacher=document.getElementById('absentTeacher').value.trim();const activities=document.getElementById('activitiesText').value.trim();const fields=[];if(document.getElementById('basicSkills').checked)fields.push('المهارات الأساسية');if(document.getElementById('values').checked)fields.push('القيم والمواطنة الصالحة');if(document.getElementById('futureSkills').checked)fields.push('مهارات المستقبل');if(!week||!day||!date||!className||!number||!teacher||!activities||fields.length===0){showToast('أكملي جميع الحقول واختر مجالاً واحداً على الأقل','warn');return}waitSessions.push({week,day,date,className,number,teacher,activities,fields:fields.join('، ')});waitSaveSessions();renderWaitSessions();document.getElementById('sesForm').reset();showToast('تم حفظ الحصة')});document.getElementById('clearAll').addEventListener('click',()=>{if(!waitSessions.length){showToast('لا توجد حصص مسجلة','warn');return}if(!confirm('مسح جميع حصص الاحتياط؟'))return;waitSessions=[];waitSaveSessions();renderWaitSessions();showToast('تم مسح جميع الحصص')});document.getElementById('exportSessions').addEventListener('click',()=>{if(!waitSessions.length){showToast('لا توجد حصص مسجلة','warn');return}openPrintWindow(buildWaitPrintHTML(waitSessions))})}

let currentHijriYear=1447,currentHijriMonth=1;const HIJRI_MONTH_NAMES=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
function getTodayHijri(){const t=new Date();return `1447/${t.getMonth()+1}/${t.getDate()}`}
function renderHijriCalendar(calendar,input){calendar.associatedInput=input;calendar.querySelector('.hijri-month-year').textContent=HIJRI_MONTH_NAMES[currentHijriMonth-1]+' '+currentHijriYear;const daysContainer=calendar.querySelector('.hijri-days');let html='';for(let d=1;d<=30;d++)html+=`<div class="hijri-day">${d}</div>`;daysContainer.innerHTML=html;daysContainer.querySelectorAll('.hijri-day').forEach(day=>day.addEventListener('click',()=>{input.value=`${currentHijriYear}/${currentHijriMonth}/${day.textContent}`;calendar.classList.remove('active');showToast('تم اختيار التاريخ')}))}
function initHijriCalendars(){const input=document.querySelector('.hijri-date-input');const calendar=document.querySelector('.hijri-calendar');const toggle=document.querySelector('.hijri-toggle');toggle.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();calendar.classList.toggle('active');if(calendar.classList.contains('active'))renderHijriCalendar(calendar,input)});document.addEventListener('click',e=>{if(!calendar.contains(e.target)&&e.target!==toggle)calendar.classList.remove('active')});calendar.addEventListener('click',e=>e.stopPropagation());calendar.querySelector('.prev-year').onclick=()=>{currentHijriYear--;renderHijriCalendar(calendar,input)};calendar.querySelector('.next-year').onclick=()=>{currentHijriYear++;renderHijriCalendar(calendar,input)};calendar.querySelector('.prev-month').onclick=()=>{currentHijriMonth--;if(currentHijriMonth<1){currentHijriMonth=12;currentHijriYear--}renderHijriCalendar(calendar,input)};calendar.querySelector('.next-month').onclick=()=>{currentHijriMonth++;if(currentHijriMonth>12){currentHijriMonth=1;currentHijriYear++}renderHijriCalendar(calendar,input)};calendar.querySelector('.today-btn').onclick=()=>{input.value=getTodayHijri();calendar.classList.remove('active');showToast('تم اختيار تاريخ اليوم')}}
document.addEventListener('DOMContentLoaded',()=>{waitLoadSessions();initWaitForm();initHijriCalendars()});
</script>
</body>
</html>
